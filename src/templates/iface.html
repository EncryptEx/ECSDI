<!DOCTYPE html>
<html>
<head>
    <title>Cliente Compra</title>
    <style>
        .product-row { display: flex; gap: 8px; margin-bottom: 6px; }
        .product-row input[name="product[]"] { width: 180px; }
        .product-row input[name="quantity[]"] { width: 70px; }
    </style>
</head>
<body>
<h2>Nueva compra</h2>
<form action="/message" method="post">
    <div id="products">
        <div class="product-row">
            <input type="text" name="product[]" placeholder="Producto" required>
            <input type="number" name="quantity[]" placeholder="Cantidad" min="1" required>
        </div>
    </div>
    <p>
        <button type="button" onclick="addRow()">+ Añadir producto</button>
    </p>
    <p>
        <button type="submit">Comprar</button>
    </p>
</form>
<script>
    function addRow() {
        const row = document.createElement('div');
        row.className = 'product-row';
        row.innerHTML = '<input type="text" name="product[]" placeholder="Producto" required>' +
                        '<input type="number" name="quantity[]" placeholder="Cantidad" min="1" required>' +
                        '<button type="button" onclick="this.parentElement.remove()">✕</button>';
        document.getElementById('products').appendChild(row);
    }
</script>
</body>
</html>
