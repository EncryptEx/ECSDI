<!DOCTYPE html>
<html lang="en">
<head>
    <title>Client Problems</title>
<meta http-equiv="refresh" content="20">
    <style type="text/css">
        table, th, td {
            border: 1px solid black;
        }
    </style>
</head>

<body>

<h1> Posted Interactions</h1>
<p></p>
Orders = {{probs|length}}
<p></p>
<table>
    <tr>
        <th>Order ID</th>
        <th>Productos</th>
        <th>Estado</th>
    </tr>
    {% for id in probs|sort %}
    <tr>
        <td>{{id}}</td>
        <td>
            <ul style="margin:0; padding-left:16px">
            {% for prod, qty in probs[id][0].items() %}
                <li>{{prod}} × {{qty}}</li>
            {% endfor %}
            </ul>
        </td>
        <td>{{probs[id][1]}}</td>
     </tr>
    {% endfor %}
</table>

<form  action="/info" method="get">
    <p>
        <button type="submit">Refresh</button>
    </p>
</form>

</body>
</html>
